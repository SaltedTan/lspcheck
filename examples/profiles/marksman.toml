# marksman on one Markdown file.
[server]
command = ["marksman", "server"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"README.md" = """
# Hello

See [the greeting](#greeting).

## Greeting

Hello, world.
"""

[document]
path = "README.md"
language_id = "markdown"
positions = ["1:3", "3:6", "5:4"]   # heading, the link, the target heading
