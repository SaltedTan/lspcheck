# Runs the stock-server regression matrix. Its purpose, baseline contract and
# update procedure are documented in ci/stock-servers/README.md.
name: Stock servers

on:
  pull_request:
    paths: &paths
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "examples/profiles/**"
      - "ci/stock-servers/**"
      - ".github/workflows/stock-servers.yml"
  push:
    branches: [main]
    paths: *paths
  schedule:
    # Weekly, so a change in the runner image (Go, Rust, Node) shows up.
    - cron: "23 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-servers-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.3
  GO_SHA256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
  GOPLS_VERSION: v0.24.0
  RUST_ANALYZER_RELEASE: 2026-11-02
  RUST_ANALYZER_SHA256: 5249da68c3f36bb77ea7d401824f5e8bd8d0a47a162daf5f72208eb7c1bf1500
  LUA_LS_VERSION: 3.19.2
  LUA_LS_SHA256: 93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947
  BASEDPYRIGHT_VERSION: 1.40.2
  BASEDPYRIGHT_SHA256: 5d1073a0e61a1adc6b40b2bed4489017aa5c1336aa8e6fdcb7157b9bf26f3fab
  CLANGD_VERSION: 23.1.0
  CLANGD_SHA256: e53b1a96196095faedb7642cf64964f7fb9ad4a0c1f00dd2c172a3d9dcbafdfd
  MARKSMAN_RELEASE: 2026-02-08
  MARKSMAN_SHA256: be5098e8213219269c47fc0d916a66fa31ce0602ec967475c722260aabf26087
  RUFF_VERSION: 0.17.4
  RUFF_SHA256: d1d6ec9ce1ce0c01e23532a157a677077ba1f82f7cd2cde6f0bd75e65f85df93
  TEXLAB_VERSION: v5.26.0
  TEXLAB_SHA256: 8697bd5e479d4584b14b7eed5c320c80ec4e1d91ebefbb6801e6bf38e9971300
  ZLS_VERSION: 0.17.0
  ZLS_SHA256: dfa4514e1868803fdf2ae56832c88b9d400094d70ea6bb136b57bcc91af10258

jobs:
  check:
    name: ${{ matrix.server }}
    strategy:
      fail-fast: false
      matrix:
        server: [gopls, rust-analyzer, lua-language-server, basedpyright, clangd, marksman, ruff, texlab, zls]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the verdict comparison
        run: python3 -I ci/stock-servers/test_compare.py
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build lspcheck
        run: |
          cargo build --locked --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
          mkdir "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Go and gopls
        if: matrix.server == 'gopls'
        run: |
          curl -fsSL --retry 6 --retry-delay 20 "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz" -o "$RUNNER_TEMP/go.tar.gz"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/go/bin:$PATH" GOBIN="$RUNNER_TEMP/bin" GOTOOLCHAIN=local
          # The Go checksum database verifies gopls and its dependencies.
          go install "golang.org/x/tools/gopls@$GOPLS_VERSION"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          gopls version
      - name: Install rust-analyzer
        if: matrix.server == 'rust-analyzer'
        run: |
          gz="$RUNNER_TEMP/rust-analyzer.gz"
          curl -fsSL --retry 6 --retry-delay 20 -o "$gz" \
            "https://github.com/rust-lang/rust-analyzer/releases/download/$RUST_ANALYZER_RELEASE/rust-analyzer-x86_64-unknown-linux-gnu.gz"
          echo "$RUST_ANALYZER_SHA256  $gz" | sha256sum --check --strict
          gunzip -c "$gz" > "$RUNNER_TEMP/bin/rust-analyzer"
          chmod +x "$RUNNER_TEMP/bin/rust-analyzer"
          "$RUNNER_TEMP/bin/rust-analyzer" --version
          # The profile's project is outside this checkout, so it builds with
          # the runner's default toolchain, not the pinned one.
          cargo --version
      - name: Install lua-language-server
        if: matrix.server == 'lua-language-server'
        run: |
          curl -fsSL --retry 6 --retry-delay 20 -o "$RUNNER_TEMP/lua-ls.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/$LUA_LS_VERSION/lua-language-server-$LUA_LS_VERSION-linux-x64.tar.gz"
          echo "$LUA_LS_SHA256  $RUNNER_TEMP/lua-ls.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/lua-ls"
          tar -xzf "$RUNNER_TEMP/lua-ls.tar.gz" -C "$RUNNER_TEMP/lua-ls"
          ln -s "$RUNNER_TEMP/lua-ls/bin/lua-language-server" "$RUNNER_TEMP/bin/lua-language-server"
          lua-language-server --version
      - name: Install basedpyright
        if: matrix.server == 'basedpyright'
        run: |
          # The package has no dependencies, so its tarball runs as it is.
          curl -fsSL --retry 6 --retry-delay 20 -o "$RUNNER_TEMP/basedpyright.tgz" \
            "https://registry.npmjs.org/basedpyright/-/basedpyright-$BASEDPYRIGHT_VERSION.tgz"
          echo "$BASEDPYRIGHT_SHA256  $RUNNER_TEMP/basedpyright.tgz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/basedpyright"
          tar -xzf "$RUNNER_TEMP/basedpyright.tgz" -C "$RUNNER_TEMP/basedpyright"
          ln -s "$RUNNER_TEMP/basedpyright/package/langserver.index.js" "$RUNNER_TEMP/bin/basedpyright-langserver"
          node --version
      - name: Install clangd
        if: matrix.server == 'clangd'
        run: |
          curl -fsSL --retry 6 --retry-delay 20 -o "$RUNNER_TEMP/clangd.zip" \
            "https://github.com/clangd/clangd/releases/download/$CLANGD_VERSION/clangd-linux-$CLANGD_VERSION.zip"
          echo "$CLANGD_SHA256  $RUNNER_TEMP/clangd.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/clangd.zip" -d "$RUNNER_TEMP"
          ln -s "$RUNNER_TEMP/clangd_$CLANGD_VERSION/bin/clangd" "$RUNNER_TEMP/bin/clangd"
          clangd --version
      - name: Install marksman
        if: matrix.server == 'marksman'
        run: |
          curl -fsSL --retry 6 --retry-delay 20 -o "$RUNNER_TEMP/bin/marksman" \
            "https://github.com/artempyanykh/marksman/releases/download/$MARKSMAN_RELEASE/marksman-linux-x64"
          echo "$MARKSMAN_SHA256  $RUNNER_TEMP/bin/marksman" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/marksman"
          marksman --version
      - name: Install ruff
        if: matrix.server == 'ruff'
        run: |
          curl -fsSL --retry 6 --retry-delay 20 -o "$RUNNER_TEMP/ruff.tar.gz" \
            "https://github.com/astral-sh/ruff/releases/download/$RUFF_VERSION/ruff-x86_64-unknown-linux-musl.tar.gz"
          echo "$RUFF_SHA256  $RUNNER_TEMP/ruff.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP"
          ln -s "$RUNNER_TEMP/ruff-x86_64-unknown-linux-musl/ruff" "$RUNNER_TEMP/bin/ruff"
          ruff --version
      - name: Install texlab
        if: matrix.server == 'texlab'
        run: |
          curl -fsSL --retry 6 --retry-delay 20 -o "$RUNNER_TEMP/texlab.tar.gz" \
            "https://github.com/latex-lsp/texlab/releases/download/$TEXLAB_VERSION/texlab-x86_64-linux.tar.gz"
          echo "$TEXLAB_SHA256  $RUNNER_TEMP/texlab.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/texlab.tar.gz" -C "$RUNNER_TEMP/bin"
          texlab --version
      - name: Install zls
        if: matrix.server == 'zls'
        run: |
          # Without zig on PATH, zls still parses and analyses the profile's file.
          curl -fsSL --retry 6 --retry-delay 20 -o "$RUNNER_TEMP/zls.tar.xz" \
            "https://github.com/zigtools/zls/releases/download/$ZLS_VERSION/zls-x86_64-linux.tar.xz"
          echo "$ZLS_SHA256  $RUNNER_TEMP/zls.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/zls"
          tar -xJf "$RUNNER_TEMP/zls.tar.xz" -C "$RUNNER_TEMP/zls"
          ln -s "$RUNNER_TEMP/zls/zls" "$RUNNER_TEMP/bin/zls"
          zls --version

      - name: Run lspcheck
        env:
          SERVER: ${{ matrix.server }}
        run: |
          mkdir "$RUNNER_TEMP/out"
          # The servers fail some checks, so the exit status says nothing here;
          # the next step compares verdicts. A missing report fails it.
          lspcheck --profile "examples/profiles/$SERVER.toml" --json "$RUNNER_TEMP/out/report.json" \
            --markdown "$GITHUB_STEP_SUMMARY" --transcripts "$RUNNER_TEMP/out/transcripts" || true
      - name: Compare verdicts with ci/stock-servers
        env:
          SERVER: ${{ matrix.server }}
        run: |
          if ! ci/stock-servers/compare "ci/stock-servers/$SERVER.verdicts" "$RUNNER_TEMP/out/report.json"; then
            echo "::error::$SERVER's verdicts changed; see the diff above and ci/stock-servers/README.md"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: stock-servers-${{ matrix.server }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14
