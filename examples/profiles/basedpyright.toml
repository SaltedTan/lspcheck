# basedpyright on one Python file.
[server]
command = ["basedpyright-langserver", "--stdio"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"main.py" = """
def greet(name: str) -> str:
    return "hello, " + name


print(greet("world"))
"""

[document]
path = "main.py"
language_id = "python"
positions = ["1:5", "1:11", "5:7"]   # greet, name, the call to greet
