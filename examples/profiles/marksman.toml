# marksman on one Markdown file.
[server]
command = ["marksman", "server"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"README.md" = """
# Hello

See [the greeting](#greeting).

## Greeting

Hello, world.
"""

[document]
path = "README.md"
language_id = "markdown"
positions = ["1:3", "3:6", "5:4"]   # heading, the link, the target heading

# Used only by the experimental `--mutate`; see docs/source-mutations.md. The lexicon only steers where edits land.
[mutation]
fragments = ["[", "](", "](#", "[[", "# ", "```", "<!--"]

[mutation.lexicon]
block_comments = [["<!--", "-->"]]
strings = [{ open = "`", close = "`" }]   # code spans
identifier_chars = "_-"
brackets = ["()", "[]"]

[mutation.recovery]
# Its document symbols are its headings, read from the text alone, so they return to the baseline.
expect = "baseline"
