# gopls on a one-file Go module. Needs `go` on PATH.
[server]
command = ["gopls", "serve"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"go.mod" = """
module example.com/hello

go 1.22
"""
"main.go" = """
package main

import "fmt"

func greet(name string) string {
\treturn "hello, " + name
}

func main() {
\tfmt.Println(greet("world"))
}
"""

[document]
path = "main.go"
language_id = "go"
positions = ["5:6", "5:12", "10:14"]   # greet, name, the call to greet

# Used only by the experimental `--mutate`; see docs/source-mutations.md. The lexicon only steers where edits land.
[mutation]
fragments = ["0x", "1e", "'\\", ":=", "...", "func(", "<-"]

[mutation.lexicon]
line_comments = ["//"]
block_comments = [["/*", "*/"]]
strings = [{ open = '"', close = '"', escape = '\' }, { open = "'", close = "'", escape = '\' }, { open = "`", close = "`" }]
keywords = ["package", "import", "func", "return", "var", "const", "type", "struct", "if", "else", "for", "range"]
# No [mutation.recovery] expect: diagnostics depend on the module graph and standard library gopls loads, not only
# on the text, so a recovery not seen stays ERROR rather than FAIL.
