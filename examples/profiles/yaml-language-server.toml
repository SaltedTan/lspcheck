# yaml-language-server on one YAML file.
[server]
command = ["yaml-language-server", "--stdio"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"config.yaml" = """
name: hello
greeting:
  text: world
  count: 3
"""

[document]
path = "config.yaml"
language_id = "yaml"
positions = ["1:1", "2:1", "3:3"]   # name, greeting, text
