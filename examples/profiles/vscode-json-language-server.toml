# vscode-json-language-server on one JSON file.
[server]
command = ["vscode-json-language-server", "--stdio"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"data.json" = """
{
  "name": "hello",
  "greeting": { "text": "world", "count": 3 }
}
"""

[document]
path = "data.json"
language_id = "json"
positions = ["2:4", "3:4", "3:18"]   # name, greeting, text
