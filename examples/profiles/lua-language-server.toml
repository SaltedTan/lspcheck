# lua-language-server on one Lua file.
[server]
command = ["lua-language-server"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"main.lua" = """
local function greet(name)
  return "hello, " .. name
end

print(greet("world"))
"""

[document]
path = "main.lua"
language_id = "lua"
positions = ["1:16", "1:22", "5:7"]   # greet, name, the call to greet
