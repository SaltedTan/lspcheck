name: Release

# A tag vX.Y.Z builds lspcheck for every supported platform, checks each
# binary against the stand-in on its own platform, and publishes the archives
# with SHA-256 checksums and build provenance. Pull requests that change this
# file, and manual runs, do everything except attest and publish.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Read the version, and check a tag matches it
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lspcheck") | .version')
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml's version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_STRIP: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Build
        run: |
          cargo build --locked --release --target "$TARGET" --bin lspcheck
          # The stand-in is built only to check the release binary below; it isn't shipped.
          cargo build --locked --release --target "$TARGET" --features standin --bin lspcheck-standin
      - name: Check the Linux binary is static
        if: runner.os == 'Linux'
        run: |
          # No shared libraries and no dynamic loader (Rust links musl binaries static-pie).
          bin="target/$TARGET/release/lspcheck"
          file "$bin"
          if readelf -d "$bin" | grep -q NEEDED || readelf -l "$bin" | grep -q INTERP; then
            echo "::error::$bin is dynamically linked"
            exit 1
          fi
      - name: Check the binary against the stand-in
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          bin="target/$TARGET/release"
          "$bin/lspcheck$exe" --version
          "$bin/lspcheck$exe" -- "$bin/lspcheck-standin$exe"
      - name: Package
        run: |
          name="lspcheck-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "../target/$TARGET/release/lspcheck.exe" "$name/"
            pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
          else
            cp "../target/$TARGET/release/lspcheck" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lspcheck-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lspcheck-*
          path: dist
          merge-multiple: true
      - name: Write the checksums
        run: |
          cd dist
          sha256sum lspcheck-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
      - name: Take the release notes from the changelog
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # The section under "## X.Y.Z", up to the next "## " heading. A run
          # that isn't for a tag tries the Unreleased section instead.
          section="$VERSION"; [ "$REF_TYPE" = tag ] || section=Unreleased
          awk -v v="$section" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $section"
            exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*
            notes.md
          if-no-files-found: error
          retention-days: 7

  # Only this job can write, and only for a tag.
  publish:
    if: github.ref_type == 'tag'
    needs: [version, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/dist/lspcheck-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/dist/* --verify-tag --title "lspcheck $VERSION" \
            --notes-file release/notes.md
