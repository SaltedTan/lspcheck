# rust-analyzer on a one-file Cargo project. Needs `cargo` on PATH.
[server]
command = ["rust-analyzer"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"Cargo.toml" = """
[package]
name = "hello"
version = "0.1.0"
edition = "2021"
"""
"src/main.rs" = """
fn greet(name: &str) -> String {
    format!("hello, {name}")
}

fn main() {
    println!("{}", greet("world"));
}
"""

[document]
path = "src/main.rs"
language_id = "rust"
positions = ["1:4", "1:10", "6:20"]   # greet, name, the call to greet

# Used only by the experimental `--mutate`; see docs/source-mutations.md. The lexicon only steers where edits land.
[mutation]
fragments = ["0x", "1e", "r#\"", "'", "::<", "#[", "=>"]

[mutation.lexicon]
line_comments = ["//"]
block_comments = [["/*", "*/"]]   # Rust's nest; the lexicon's don't, which only moves where edits land
strings = [{ open = '"', close = '"', escape = '\' }]   # no '…': it would take lifetimes for characters
keywords = ["fn", "let", "mut", "pub", "struct", "impl", "return", "match", "if", "else", "use"]
# No [mutation.recovery] expect: diagnostics depend on the sysroot rust-analyzer loads in the background, not only on
# the text, so a recovery not seen stays ERROR rather than FAIL.
