# taplo on one TOML file.
[server]
command = ["taplo", "lsp", "stdio"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"config.toml" = """
name = "hello"

[greeting]
text = "world"
count = 3
"""

[document]
path = "config.toml"
language_id = "toml"
positions = ["1:1", "3:2", "4:1"]   # name, the table, text
