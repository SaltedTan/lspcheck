# lemminx on one XML file.
[server]
command = ["lemminx"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"greeting.xml" = """
<?xml version="1.0" encoding="UTF-8"?>
<greeting lang="en">
  <name>world</name>
</greeting>
"""

[document]
path = "greeting.xml"
language_id = "xml"
positions = ["2:2", "2:11", "3:4"]   # greeting, its attribute, name
