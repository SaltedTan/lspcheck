# typescript-language-server on one TypeScript file.
[server]
command = ["typescript-language-server", "--stdio"]
startup_timeout = "60s"
request_timeout = "30s"

[workspace.files]
"tsconfig.json" = """
{ "compilerOptions": { "strict": true, "target": "es2022" }, "files": ["main.ts"] }
"""
"main.ts" = """
function greet(name: string): string {
  return "hello, " + name;
}

console.log(greet("world"));
"""

[document]
path = "main.ts"
language_id = "typescript"
positions = ["1:10", "1:16", "5:13"]   # greet, name, the call to greet
